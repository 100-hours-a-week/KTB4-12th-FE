name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  IMAGE_NAME: peterj0117/seonjalal-fe
  DEV_AWS_REGION: ap-northeast-2
  DEV_ECR_REPOSITORY: seonjalal/develop/frontend
  VITE_USE_MOCK_API: 'false'
  VITE_API_BASE_URL: /api
  VITE_BUG_REPORT_ENDPOINT: /bug-report
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: prototype/.nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Verify Node.js and npm versions
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Type check source
        run: npm run typecheck

      - name: Build application
        run: |
          test -n "$VITE_SENTRY_DSN" || { echo "Repository variable VITE_SENTRY_DSN is required." >&2; exit 1; }
          npm run build

      - name: Verify static output
        run: test -f dist/client/index.html

      - name: Test Sites build output
        run: npm run test:sites

      - name: Build Docker image
        run: >-
          docker build
          --build-arg VITE_USE_MOCK_API="${VITE_USE_MOCK_API}"
          --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}"
          --build-arg VITE_BUG_REPORT_ENDPOINT="${VITE_BUG_REPORT_ENDPOINT}"
          --build-arg VITE_SENTRY_DSN="${VITE_SENTRY_DSN}"
          --tag seonjalal-fe:ci
          .

      - name: Run container and smoke test
        shell: bash
        run: |
          CONTAINER="seonjalal-fe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker run --detach \
            --name "$CONTAINER" \
            --publish 127.0.0.1::80 \
            seonjalal-fe:ci
          HOST_PORT="$(docker port "$CONTAINER" 80/tcp | sed 's/.*://')"
          if ! RESPONSE="$(
            curl --fail-with-body --silent --show-error \
              --retry 15 \
              --retry-all-errors \
              --retry-connrefused \
              --retry-delay 2 \
              "http://127.0.0.1:${HOST_PORT}/"
          )"; then
            echo "$RESPONSE"
            exit 1
          fi

          grep --quiet 'id="root"' <<< "$RESPONSE"

      - name: Print validation logs
        if: failure()
        shell: bash
        run: |
          CONTAINER="seonjalal-fe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if docker inspect "$CONTAINER" > /dev/null 2>&1; then
            echo "Frontend container logs:"
            docker logs "$CONTAINER" || true
          fi

      - name: Clean up validation resources
        if: always()
        run: >-
          docker rm --force
          "seonjalal-fe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          2>/dev/null || true

  publish-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-publish-develop
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.DEV_ECR_ROLE_ARN }}
          aws-region: ${{ env.DEV_AWS_REGION }}
          role-session-name: seonjalal-develop-fe-publish
          allowed-account-ids: ${{ vars.DEV_AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="develop-${GITHUB_SHA}"
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${DEV_ECR_REPOSITORY}:${IMAGE_TAG}"

          if aws ecr describe-images \
            --region "${DEV_AWS_REGION}" \
            --repository-name "${DEV_ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.image.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push develop image
        if: steps.image.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: prototype
          file: prototype/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            VITE_USE_MOCK_API=${{ env.VITE_USE_MOCK_API }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_BUG_REPORT_ENDPOINT=${{ env.VITE_BUG_REPORT_ENDPOINT }}
            VITE_SENTRY_DSN=${{ env.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=develop-frontend
          cache-to: type=gha,mode=max,scope=develop-frontend

      - name: Record develop image
        shell: bash
        run: |
          {
            echo "## Develop frontend image"
            echo
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Published in this run: \`${{ steps.image.outputs.publish }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version
        id: version
        shell: bash
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "VERSION must use semantic version format: $VERSION" >&2
            exit 1
          fi
          if git rev-parse --quiet --verify "refs/tags/v${VERSION}" > /dev/null; then
            echo "Git tag v${VERSION} already exists." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Ensure Docker version tag is unused
        shell: bash
        run: |
          IMAGE="${IMAGE_NAME}:${{ steps.version.outputs.value }}"
          if INSPECT_OUTPUT="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"; then
            echo "Docker image tag already exists: $IMAGE" >&2
            exit 1
          fi
          if ! grep --extended-regexp --ignore-case 'not found|manifest unknown' <<< "$INSPECT_OUTPUT" > /dev/null; then
            echo "Could not verify Docker image tag availability: $INSPECT_OUTPUT" >&2
            exit 1
          fi

      - name: Build and push version image
        uses: docker/build-push-action@v6
        with:
          context: prototype
          file: prototype/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
          build-args: |
            VITE_USE_MOCK_API=${{ env.VITE_USE_MOCK_API }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_BUG_REPORT_ENDPOINT=${{ env.VITE_BUG_REPORT_ENDPOINT }}
            VITE_SENTRY_DSN=${{ env.VITE_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push Git tag
        shell: bash
        run: |
          git tag "v${{ steps.version.outputs.value }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.value }}"
