name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - develop
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  DEV_AWS_REGION: ap-northeast-2
  DEV_ECR_REPOSITORY: seonjalal/develop/frontend
  VITE_USE_MOCK_API: 'false'
  VITE_API_BASE_URL: /api
  VITE_BUG_REPORT_ENDPOINT: /bug-report
  VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: prototype

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: prototype/.nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Verify Node.js and npm versions
        shell: bash
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.19.0"
          test "$(npm --version | cut -d. -f1)" = "11"

      - name: Install dependencies
        run: npm ci

      - name: Lint source
        run: npm run lint

      - name: Type check source
        run: npm run typecheck

      - name: Build application
        run: |
          test -n "$VITE_SENTRY_DSN" || { echo "Repository variable VITE_SENTRY_DSN is required." >&2; exit 1; }
          npm run build

      - name: Verify static output
        run: test -f dist/client/index.html

      - name: Test Sites build output
        run: npm run test:sites

      - name: Build Docker image
        run: >-
          docker build
          --build-arg VITE_USE_MOCK_API="${VITE_USE_MOCK_API}"
          --build-arg VITE_API_BASE_URL="${VITE_API_BASE_URL}"
          --build-arg VITE_BUG_REPORT_ENDPOINT="${VITE_BUG_REPORT_ENDPOINT}"
          --build-arg VITE_SENTRY_DSN="${VITE_SENTRY_DSN}"
          --tag seonjalal-fe:ci
          .

      - name: Test static release publication and rollback
        run: python3 -m unittest discover -s ../.github/scripts -p test_frontend_static_release.py

      - name: Run container and smoke test
        shell: bash
        run: |
          CONTAINER="seonjalal-fe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker run --detach \
            --name "$CONTAINER" \
            --publish 127.0.0.1::80 \
            seonjalal-fe:ci
          HOST_PORT="$(docker port "$CONTAINER" 80/tcp | sed 's/.*://')"
          if ! RESPONSE="$(
            curl --fail-with-body --silent --show-error \
              --retry 15 \
              --retry-all-errors \
              --retry-connrefused \
              --retry-delay 2 \
              "http://127.0.0.1:${HOST_PORT}/"
          )"; then
            echo "$RESPONSE"
            exit 1
          fi

          grep --quiet 'id="root"' <<< "$RESPONSE"

      - name: Print validation logs
        if: failure()
        shell: bash
        run: |
          CONTAINER="seonjalal-fe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          if docker inspect "$CONTAINER" > /dev/null 2>&1; then
            echo "Frontend container logs:"
            docker logs "$CONTAINER" || true
          fi

      - name: Clean up validation resources
        if: always()
        run: >-
          docker rm --force
          "seonjalal-fe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          2>/dev/null || true

  publish-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-publish-develop
      cancel-in-progress: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.DEV_ECR_ROLE_ARN }}
          aws-region: ${{ env.DEV_AWS_REGION }}
          role-session-name: seonjalal-develop-fe-publish
          allowed-account-ids: ${{ vars.DEV_AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve immutable image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          IMAGE_TAG="develop-${GITHUB_SHA}"
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${DEV_ECR_REPOSITORY}:${IMAGE_TAG}"

          if aws ecr describe-images \
            --region "${DEV_AWS_REGION}" \
            --repository-name "${DEV_ECR_REPOSITORY}" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            >/dev/null 2>&1; then
            echo "publish=false" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
          fi

          echo "uri=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.image.outputs.publish == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push develop image
        if: steps.image.outputs.publish == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: prototype
          file: prototype/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.uri }}
          build-args: |
            VITE_USE_MOCK_API=${{ env.VITE_USE_MOCK_API }}
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_BUG_REPORT_ENDPOINT=${{ env.VITE_BUG_REPORT_ENDPOINT }}
            VITE_SENTRY_DSN=${{ env.VITE_SENTRY_DSN }}
          cache-from: type=gha,scope=develop-frontend
          cache-to: type=gha,mode=max,scope=develop-frontend

      - name: Record develop image
        shell: bash
        run: |
          {
            echo "## Develop frontend image"
            echo
            echo "- Image: \`${{ steps.image.outputs.uri }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Published in this run: \`${{ steps.image.outputs.publish }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-develop:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: publish-develop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-deploy-develop-frontend
      cancel-in-progress: false

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.DEV_CD_ROLE_ARN }}
          aws-region: ${{ env.DEV_AWS_REGION }}
          role-session-name: seonjalal-develop-fe-deploy
          allowed-account-ids: ${{ vars.DEV_AWS_ACCOUNT_ID }}

      - name: Reconcile frontend on Develop runtime
        shell: bash
        env:
          DEV_EC2_INSTANCE_ID: ${{ vars.DEV_EC2_INSTANCE_ID }}
          DESIRED_SHA_PARAMETER: /seonjalal/develop/release/frontend_sha
        run: |
          set -euo pipefail

          if [[ ! "${DEV_EC2_INSTANCE_ID}" =~ ^i-[0-9a-f]+$ ]]; then
            echo "DEV_EC2_INSTANCE_ID is invalid." >&2
            exit 1
          fi

          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "GITHUB_SHA is invalid." >&2
            exit 1
          fi

          PREVIOUS_SHA="$(
            aws ssm get-parameter \
              --region "${DEV_AWS_REGION}" \
              --name "${DESIRED_SHA_PARAMETER}" \
              --query 'Parameter.Value' \
              --output text
          )"

          if [[ ! "${PREVIOUS_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Previous frontend SHA parameter is invalid." >&2
            exit 1
          fi

          aws ssm put-parameter \
            --region "${DEV_AWS_REGION}" \
            --name "${DESIRED_SHA_PARAMETER}" \
            --type String \
            --value "${GITHUB_SHA}" \
            --overwrite \
            >/dev/null

          PING_STATUS="$(
            aws ssm describe-instance-information \
              --region "${DEV_AWS_REGION}" \
              --filters "Key=InstanceIds,Values=${DEV_EC2_INSTANCE_ID}" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text
          )"

          if [[ "${PING_STATUS}" != "Online" ]]; then
            {
              echo "## Develop frontend deployment"
              echo
              echo "- Desired commit: \`${GITHUB_SHA}\`"
              echo "- Runtime: offline"
              echo "- Result: next instance boot reconciliation pending"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          COMMAND_ID="$(
            aws ssm send-command \
              --region "${DEV_AWS_REGION}" \
              --instance-ids "${DEV_EC2_INSTANCE_ID}" \
              --document-name seonjalal-v2-develop-reconcile \
              --comment "Reconcile Develop frontend ${GITHUB_SHA}" \
              --query 'Command.CommandId' \
              --output text
          )"

          COMMAND_STATUS=Pending
          for ATTEMPT in {1..72}; do
            set +e
            COMMAND_STATUS="$(
              aws ssm get-command-invocation \
                --region "${DEV_AWS_REGION}" \
                --command-id "${COMMAND_ID}" \
                --instance-id "${DEV_EC2_INSTANCE_ID}" \
                --query Status \
                --output text \
                2>/dev/null
            )"
            LOOKUP_STATUS=$?
            set -e

            if [[ "${LOOKUP_STATUS}" -ne 0 ]]; then
              sleep 10
              continue
            fi

            case "${COMMAND_STATUS}" in
              Success|Cancelled|Failed|TimedOut|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed)
                sleep 10
                ;;
              *)
                echo "Unexpected SSM command status: ${COMMAND_STATUS}" >&2
                break
                ;;
            esac
          done

          if [[ "${COMMAND_STATUS}" != "Success" ]]; then
            aws ssm get-command-invocation \
              --region "${DEV_AWS_REGION}" \
              --command-id "${COMMAND_ID}" \
              --instance-id "${DEV_EC2_INSTANCE_ID}" \
              --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
              --output json || true

            aws ssm put-parameter \
              --region "${DEV_AWS_REGION}" \
              --name "${DESIRED_SHA_PARAMETER}" \
              --type String \
              --value "${PREVIOUS_SHA}" \
              --overwrite \
              >/dev/null

            echo "Develop frontend deployment failed; desired SHA restored." >&2
            exit 1
          fi

          {
            echo "## Develop frontend deployment"
            echo
            echo "- Desired commit: \`${GITHUB_SHA}\`"
            echo "- Runtime: online"
            echo "- Result: deployed and verified"
          } >> "${GITHUB_STEP_SUMMARY}"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: frontend-static-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version and tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          if git rev-parse --quiet --verify "refs/tags/v${VERSION}" >/dev/null && \
             [[ "$(git rev-list -n 1 "v${VERSION}")" != "$GITHUB_SHA" ]]; then
            echo '버전 태그가 다른 소스를 가리킵니다.' >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: prototype/.nvmrc
          cache: npm
          cache-dependency-path: prototype/package-lock.json
      - name: Build static release
        working-directory: prototype
        run: |
          npm ci
          npm run build
          npm run test:sites
      - name: Configure main-only static publisher
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.RELEASE_S3_ROLE_ARN }}
          aws-region: ap-northeast-2
          allowed-account-ids: '721744297924'
      - name: Publish immutable versioned static files
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: python3 .github/scripts/frontend-static-release.py publish --version "$RELEASE_VERSION" --apply
      - name: Create release source tag
        shell: bash
        run: |
          git rev-parse --verify "refs/tags/v${{ steps.version.outputs.value }}" >/dev/null 2>&1 || \
            git tag "v${{ steps.version.outputs.value }}" "$GITHUB_SHA"
          git push origin "v${{ steps.version.outputs.value }}"
